services:
  - type: web
    name: disha-backend
    env: go
    buildCommand: go build -ldflags="-s -w" -o disha-server ./cmd/server
    startCommand: ./disha-server
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: GOOGLE_API_KEY
        sync: false
    healthCheckPath: /api/v1/health
